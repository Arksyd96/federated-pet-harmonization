# constants
SEED: 101
WANDB_API_KEY: bdc8857f9d6f7010cff35bcdc0ae9413e05c75e1

# modules state
project_name: federated-pet
dir_name: runs/2d-to-3d-pet-earl-translation-unet-dsr30-a100
name: Traduction PET EARL1/2 5x64x64 DSR 30p A100 (UNet)

datamodule:
    root_dir: ./data/PET-EARL/A100EARL1et2_Nifti/
    batch_size: 64
    # train_ratio: 0.95 # No DSR
    train_ratio: 30 # for DSR with N subjects only
    patch_size: [5, 64, 64]
    num_workers: 16 
    queue_max_length: 9000
    samples_per_volume: 350

# Diffusion related modules
denoiser:
    in_ch: 10
    out_ch: 5
    spatial_dims: 2
    hid_chs: [64, 128, 256, 512]
    kernel_sizes: [3, 3, 3, 3]
    strides: [1, 2, 2, 2]
    temb_channels: 128
    max_period: 100
    scale_shift_norm: true

    # Tuple (str, Dict) converti en liste YAML
    act_name: 
    - swish
    - {}

    # Tuple avec dictionnaire de paramètres
    norm_name: 
    - group
    - {num_groups: 32, affine: true}

    deep_supervision: false
    use_res_block: true
    estimate_variance: false
    use_self_conditioning: false
    dropout: 0.0
    learnable_interpolation: true
    use_attention: none
    num_res_blocks: 2

scheduler:
    timesteps: 100
    beta_start: 0.002
    beta_end: 0.02
    schedule_strategy: scaled_linear

diffuser:
    estimate_variance: false
    use_self_conditioning: false
    classifier_free_guidance_dropout: 0.0  # Disable during training by setting to 0
    estimator_objective: x_0
    use_ema: false
    clip_x0: false
    sample_every_n_steps: 1000
    optimizer_kwargs: {lr: 4.0e-6}


# UNet regression style related modules
translation_model:
    in_ch: 5          
    out_ch: 10         
    spatial_dims: 2 
    hid_chs: [64, 128, 256, 512]
    kernel_sizes: [3, 3, 3, 3]
    strides: [1, 2, 2, 2]
    
    # Hyperparamètres d'entraînement
    alpha: 1.  # Facteur d'amplification du résidu
    learning_rate: 1.0e-4
    weight_decay: 1.0e-5
    # suv_global_log_max: 6.0 # Notre max P98 (en espace log) = DATASET CHB !!
    # suv_global_log_max: 5.5 # Notre max P99.9 (en espace log) = DATASET RENNES !!
    suv_global_log_max: 6.0 # Notre max P99.9 (en espace log) = DATASET A100 !!
    

# trainer state
model_checkpoint:
    monitor: val/L1
    every_n_epochs: 1
    save_last: true
    save_top_k: 1
    mode: min

trainer:
    precision: 32
    accelerator: gpu
    log_every_n_steps: 1
    min_epochs: 100
    max_epochs: 200
    check_val_every_n_epoch: 10
    num_sanity_val_steps: 0

    gradient_clip_val: 1.0 # Sécurité anti-pics
    gradient_clip_algorithm: "norm"

    # For Debugging
    # Force l'arrêt de l'époque de train après 100 batchs (au lieu de 2000)
    # limit_train_batches: 10
    
    # Force l'arrêt de la validation après 10 batchs (au lieu de tout le dataset)
    limit_val_batches: 30
    # fast_dev_run: true
