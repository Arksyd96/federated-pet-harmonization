# constants
SEED: 101
WANDB_API_KEY: bdc8857f9d6f7010cff35bcdc0ae9413e05c75e1

# modules state
project_name: federated-pet
dir_name: runs/pet-earl-translation/2d-to-3d-pet-earl-translation-unet-dsr10-a100
name: Traduction PET EARL1 only 5x64x64 DSR 10p A100 (UNet)

datamodule:
    root_dir: ./data/PET-EARL/a100
    batch_size: 64
    # train_ratio: 1.0 # No DSR
    train_ratio: 10 # for DSR with N subjects only | 0 means all as validation
    patch_size: [5, 64, 64]
    num_workers: 16 
    queue_max_length: 9000
    samples_per_volume: 350

# UNet regression style related modules
translation_model:
    in_ch: 5          
    out_ch: 5         
    spatial_dims: 2 
    hid_chs: [128, 128, 256, 512]
    kernel_sizes: [3, 3, 3, 3]
    strides: [1, 2, 2, 2]
    
    # Hyperparamètres d'entraînement
    alpha: 1.0                  # Facteur d'amplification du résidu
    learning_rate: 1.0e-4
    weight_decay: 1.0e-6
    # suv_global_log_max: 5.5   # Notre max P99.9 Rennes
    suv_global_log_max: 6.0     # Notre max P99.9 CHB/A100/Nantes
    

# trainer state
model_checkpoint:
    monitor: val/L1
    every_n_epochs: 1
    save_last: true
    save_top_k: 1
    mode: min

trainer:
    precision: 32
    accelerator: gpu
    log_every_n_steps: 1
    min_epochs: 100
    max_epochs: 1000
    check_val_every_n_epoch: 10
    num_sanity_val_steps: 0

    gradient_clip_val: 1.0 # Sécurité anti-pics
    gradient_clip_algorithm: "norm"

    # For Debugging
    # Force l'arrêt de l'époque de train après 100 batchs (au lieu de 2000)
    # limit_train_batches: 10
    
    # Force l'arrêt de la validation après 10 batchs (au lieu de tout le dataset)
    limit_val_batches: 50
    # fast_dev_run: true
